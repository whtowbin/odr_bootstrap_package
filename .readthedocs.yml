version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

formats:
  - pdf
  - epub

# Index page configuration
redirect_www: false

# Exclude built docs output from source scanning
# RTD v2 uses 'build' settings for os/tools and source configuration
# rather than the old top-level exclude_patterns key.
