version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# Install the package and its documentation dependencies into RTD's Python.
# Using the standard pip mechanism ensures sphinx runs with the same Python
# that has odrpack, sphinx, and all other deps available.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

formats:
  - pdf
  - epub
