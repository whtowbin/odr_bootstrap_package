[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odr-bootstrap"
version = "2.0.0"
description = "Orthogonal Distance Regression with Bootstrap Resampling for SIMS Calibration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Henry Towbin", email = "htowbin@caltech.edu"}
]
keywords = ["calibration", "ODR", "bootstrap", "SIMS", "uncertainty"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "matplotlib>=3.10.1",
    "numpy>=2.2.4",
    "odrpack>=0.6.1",
    "pandas>=2.2.3",
    "scipy>=1.15.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "pre-commit>=4.0.0",
]
docs = [
    "sphinx>=8.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "myst-parser>=4.0.0",
    "great-tables>=0.10.0",
]
examples = [
    "great-tables>=0.10.0",
]

[project.urls]
Repository = "https://github.com/whtowbin/odr_bootstrap_package"
Issues = "https://github.com/whtowbin/odr_bootstrap_package/issues"
Documentation = "https://odr-bootstrap-package.readthedocs.io/en/latest/index.html"
Changelog = "https://github.com/whtowbin/odr_bootstrap_package/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "odr_bootstrap/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "odr_bootstrap/**",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "docs/**",
    "examples/**",
    "*.png",
]

[tool.hatch.build.targets.wheel]
packages = ["odr_bootstrap"]

[tool.uv]
package = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=odr_bootstrap --cov-report=term-missing --cov-report=html -m 'not install'"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "install: slow end-to-end tests that build and install the package with uv (run with `pytest -m install`)",
]

[tool.coverage.run]
source = ["odr_bootstrap"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 85
precision = 2

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "UP"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.isort]
known-first-party = ["odr_bootstrap"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true
